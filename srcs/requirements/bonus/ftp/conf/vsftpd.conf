# =============================================================================
#  Inception - vsftpd, gives write access to the WordPress website volume
# =============================================================================

# Never fork into the background: the process must stay PID 1.
background=NO
listen=YES
listen_ipv6=NO
listen_port=21

# Only the local user created by the entrypoint may log in.
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# The user is locked inside its home (/var/www/html).
chroot_local_user=YES
allow_writeable_chroot=YES
user_sub_token=$USER
local_root=/var/www/html

# Passive mode: the port range published by docker compose.
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
pasv_address=127.0.0.1
pasv_addr_resolve=NO

# Restrict the accounts allowed to connect.
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

secure_chroot_dir=/var/run/vsftpd/empty
seccomp_sandbox=NO
pam_service_name=vsftpd

# Logs to the container output: /var/log/vsftpd.log is a symlink to the stdout
# of PID 1 (vsftpd refuses to open /dev/stdout directly).
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log
dual_log_enable=NO
