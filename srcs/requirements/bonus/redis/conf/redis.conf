# =============================================================================
#  Inception - Redis, used as the WordPress object cache
#  Careful: redis does not accept trailing comments on a directive line.
# =============================================================================

# Never fork: the process must stay in the foreground to be a proper PID 1.
daemonize no
supervised no

bind 0.0.0.0
port 6379

# Only reachable from the internal docker network, never published on the host.
protected-mode no

dir /data
save 900 1
appendonly no

# The cache must never grow past its budget: drop the least recently used keys.
maxmemory 256mb
maxmemory-policy allkeys-lru

loglevel notice

# Empty logfile means stdout, so `docker logs redis` works.
logfile ""
