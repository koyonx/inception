;
; Inception - php-fpm pool
; Listens on a TCP socket so the nginx container can reach it at wordpress:9000
;
[www]

user  = www-data
group = www-data

listen       = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests      = 500

; Keep the container environment (DB host, redis host, ...) visible to PHP.
clear_env = no

; Logs go to the container output.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size]       = 64M
php_admin_value[memory_limit]        = 256M
