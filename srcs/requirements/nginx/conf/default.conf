# =============================================================================
#  Inception - NGINX virtual host
#  The ONLY entrypoint of the infrastructure: port 443, TLSv1.2 / TLSv1.3 only.
#  ${DOMAIN_NAME} is replaced by envsubst in the entrypoint.
# =============================================================================

server {
    # No `listen 80` at all: port 80 is never opened.
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;

    server_name         ${DOMAIN_NAME};

    # ---- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # The subject explicitly forbids anything below TLSv1.2.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- Site --------------------------------------------------------------
    root                /var/www/html;
    index               index.php index.html;

    client_max_body_size 64M;

    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff     always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ---- PHP is handed over to the php-fpm container, never executed here ---
    location ~ \.php$ {
        try_files      $uri =404;

        include        fastcgi_params;
        fastcgi_pass   wordpress:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;

        # WordPress must know that the visitor is behind TLS.
        fastcgi_param  HTTPS           on;

        fastcgi_read_timeout 300;
    }

    # Never serve the WordPress configuration or hidden files.
    location = /wp-config.php { deny all; }
    location ~ /\.          { deny all; }

    # Static assets straight from the shared volume.
    location ~* \.(css|js|png|jpe?g|gif|ico|svg|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ---- Bonus routes (/adminer/ and /static/) -----------------------------
    include /etc/nginx/conf.d/bonus/*.conf;
}
