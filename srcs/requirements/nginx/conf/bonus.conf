# =============================================================================
#  Bonus routes, injected inside the main server block only when
#  ENABLE_BONUS=1. Both upstreams are resolved at request time through the
#  docker DNS (127.0.0.11), so nginx starts fine even if those containers are
#  not up yet.
# =============================================================================

resolver 127.0.0.11 ipv6=off valid=10s;

# ---- Adminer -----------------------------------------------------------
location = /adminer { return 301 /adminer/; }

location /adminer/ {
    set $adminer_upstream http://adminer:8080;
    rewrite ^/adminer/(.*)$ /$1 break;

    proxy_pass         $adminer_upstream;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   X-Forwarded-Prefix /adminer;
}

# ---- Static showcase website -------------------------------------------
location = /static { return 301 /static/; }

location /static/ {
    set $static_upstream http://static-site:8080;
    rewrite ^/static/(.*)$ /$1 break;

    proxy_pass         $static_upstream;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
}
