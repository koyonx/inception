# =============================================================================
#  Inception - docker compose (mandatory part only)
#  nginx (443, TLS only) -> wordpress (php-fpm) -> mariadb
# =============================================================================

services:

  # ------------------------------------------------------------------ MariaDB
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb:inception
    container_name: mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent -h localhost -u root -p\"$$(cat /run/secrets/db_root_password)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # ---------------------------------------------------------- WordPress + PHP
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:inception
    container_name: wordpress
    env_file: .env
    secrets:
      - db_password
      - credentials
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    expose:
      - "9000"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm > /dev/null && test -f /var/www/html/wp-config.php"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always

  # -------------------------------------------------------------------- NGINX
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx:inception
    container_name: nginx
    env_file: .env
    volumes:
      - wordpress:/var/www/html:ro
    networks:
      - inception
    ports:
      - "443:443"
    depends_on:
      - wordpress
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost/ -o /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

# ----------------------------------------------------------------- networking
networks:
  inception:
    name: inception
    driver: bridge

# ------------------------------------------------------------------- secrets
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

# -------------------------------------------------------------------- volumes
# Named volumes (no bind mount in the service definitions); their data is
# stored under ${DATA_PATH} = /home/<login>/data on the host machine.
volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb

  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress
